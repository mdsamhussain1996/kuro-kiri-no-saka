<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
  <title>KURO: Kiri-no-Saka — The Whispering Ascent</title>
  
  <!-- Typography per §6: Brush Calligraphy + Clean Serif -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Kaisei+Decol:wght@500;700&family=Yuji+Syuku&family=Cinzel:wght@600;700;900&display=swap" rel="stylesheet">

  <style>
    :root {
      --ink-dark: #141413;
      --ink-mid: #5c5b57;
      --ink-light: #a8a59c;
      --parchment: #eae5d9;
      --rim-highlight: #f5f1e6;
      --vermilion: #b8292f;
      --font-brush: 'Yuji Syuku', 'Kaisei Decol', serif;
      --font-serif: 'Cinzel', serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: var(--parchment);
      color: var(--ink-dark);
      font-family: var(--font-serif);
    }

    #game-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    canvas#game-canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    /* UI Overlay Layer */
    #ui-root {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 10;
    }

    .interactive {
      pointer-events: auto;
    }

    /* Debug HUD */
    #debug-overlay {
      position: absolute;
      bottom: 12px;
      right: 12px;
      background: rgba(20, 20, 19, 0.85);
      color: #f5f1e6;
      font-family: monospace;
      font-size: 11px;
      padding: 8px 12px;
      border-radius: 6px;
      border: 1px solid rgba(234, 229, 217, 0.2);
      display: none;
      pointer-events: auto;
      max-width: 320px;
    }
  </style>
  <script type="module" crossorigin src="./assets/index-CGOX8Fek.js"></script>
</head>
<body>
  <div id="game-container">
    <canvas id="game-canvas"></canvas>
    <div id="ui-root"></div>
    <div id="debug-overlay"></div>
  </div>

</body>
</html>
